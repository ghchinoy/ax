# A Task for the local stack (examples/ate_local/local-stack.sh).
#
# It uses debian:12 instead of the published ax-task-runner image, which is
# amd64-only. local-stack.sh mounts an arm64 build of ax-task-runner into every
# actor, so this runs natively on Apple silicon.
#
# Tasks are created Suspended; resume one to start its container:
#
#   ax apply -f examples/ate_local/task-local.yaml
#   ax resume local-task
#   ax describe task local-task
#   ax ssh local-task -- uname -sm
#   ax delete task local-task
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: local-task
  atespace: default
spec:
  image: "debian:12"
  env:
    - name: ENVIRONMENT
      value: "local"
  debug: true # serve guest services so `ax ssh` works
