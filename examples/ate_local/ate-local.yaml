# Configuration for ate-local (Local Substrate Control Daemon backed by Apple Container or Podman)
address: "127.0.0.1:50051"
runtime: "apple"            # "apple" (default) or "podman"
container_prefix: "ate"     # Prefix for actor container names
snapshot_dir: ""            # Optional shared directory for saving/restoring /workspace tar.gz snapshots
ready_timeout: "20s"

templates:
  # Default template for general container execution
  default:
    image: "debian:12"
    port: 50053
    command: ["sleep", "infinity"]
    cpus: 2
    memory: "1024M"

  # Demo worker template (runs ate-worker serving /readyz on :80 and gRPC Health on :50053)
  ax-harness-demo-template:
    image: "debian:12"
    port: 50053
    command: ["/usr/local/bin/ate-worker"]
    volumes:
      - "./bin/linux_arm64/ate-worker:/usr/local/bin/ate-worker"
    cpus: 2
    memory: "1024M"
    env:
      APP_ENV: "local-substrate"
