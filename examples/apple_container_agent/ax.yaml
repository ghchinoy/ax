server:
  address: ":8494"

eventlog:
  sqlite:
    filename: "examples/apple_container_agent/eventlog/log.sqlite"

planner:
  type: "gemini"
  gemini:
    model: "gemini-3.5-flash"
    timeout: "60s"

registry:
  apple_container_agents:
    # 1. Sandbox execution mode: runs commands directly in an Apple container
    - id: "AppleSandboxAgent"
      name: "Apple Container Sandbox Agent"
      description: "Executes shell commands and scripts in an isolated Apple container sandbox."
      image: "debian:12"
      mode: "sandbox"
      command: ["/bin/sh", "-c"]
      cpus: 2
      memory: "1024M"

    # 2. Service mode: runs an AX agent gRPC service inside an Apple container
    - id: "AppleServiceAgent"
      name: "Apple Container Service Agent"
      description: "Runs an AX gRPC Agent service packaged inside an Apple container."
      image: "ax-apple-agent:latest"
      mode: "service"
      port: 50051
      host_port: 0 # auto-allocate free host port
      cpus: 2
      memory: "1024M"
      keep_alive: false
